<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login devoir</title>

</head>
<body>

<div class="Login-bloc">
   
    <div class="Login-centrer">
    <h2>Log in</h2>
   </div>

 <from>

    <!-- Prénom -->
         <div class="input-group">
              <label>User Name</label>
              <input type="text" placeholder="User Name" required>
         </div>

    <!-- Email -->
         <div class="input-group">
              <label>Email</label>
              <input type="email" placeholder="email@gmail.com" required>
         </div>

    <!-- Mot de passe -->
          <div class="input-group">
               <label>Password</label>
               <input type="password" 
                            placeholder="••••••"
                            minlength="6"
                            pattern="[a-zA-Z0-9]+"
                            required>
    <!-- Message d'erreur que l'on peu voir après avec visibility -->
          <span class="error-msg">Pas de symbole ($ / etc.) et 6 caractères min.</span>
          </div>
          
    <!-- BOUTON SUBMIT -->
           <button type="submit" class="btn-submit">Submit</button>

 </from>
</div>







</body>
</html>
